name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege that still lets deploy-pages mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: node build.js

      - name: Check the build produced a usable site
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/.nojekyll
          # The page must reference the hashed bundle the build actually wrote.
          bundle=$(ls dist/app.*.js | xargs -n1 basename)
          grep -q "$bundle" dist/index.html
          # The service worker must precache that same bundle.
          grep -q "$bundle" dist/sw.js
          echo "Verified $bundle is wired into index.html and sw.js"

      # enablement asks the API to turn Pages on. It succeeds only where the
      # workflow token is allowed to administer Pages, which it usually is not,
      # so the first run may still need the one-time switch in settings. The
      # step below turns that failure into an instruction instead of an
      # HttpError. Once Pages is on, this step just reads the existing config.
      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Explain an unenabled Pages site
        if: failure() && steps.pages.outcome == 'failure'
        run: |
          echo "::error title=GitHub Pages is not enabled::Enable it once, then re-run this workflow."
          echo "Settings -> Pages -> Build and deployment -> Source: GitHub Actions"
          echo "https://github.com/${{ github.repository }}/settings/pages"
          echo
          echo "The workflow token cannot create the Pages site itself"
          echo "(Resource not accessible by integration), so this is a one-time"
          echo "manual step. Everything after it is automatic."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
