name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege that still lets deploy-pages mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build
        run: node build.js

      - name: Check the build produced a usable site
        run: |
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/.nojekyll
          # The page must reference the hashed bundle the build actually wrote.
          bundle=$(ls dist/app.*.js | xargs -n1 basename)
          grep -q "$bundle" dist/index.html
          # The service worker must precache that same bundle.
          grep -q "$bundle" dist/sw.js
          echo "Verified $bundle is wired into index.html and sw.js"

      # enablement turns Pages on via the API on the first run, so going live
      # does not depend on someone flipping a switch in repository settings.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
